services:
  postgres:
    image: postgres:16-alpine
    container_name: servium-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-servium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servium_dev}
      POSTGRES_DB: ${POSTGRES_DB:-servium}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - servium_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:latest
    container_name: servium-mailpit
    ports:
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  servium_pgdata:
